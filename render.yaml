services:
  - type: web
    name: recall-api
    runtime: node
    plan: free
    rootDir: server
    buildCommand: npm install
    startCommand: node index.js
    healthCheckPath: /health
    envVars:
      - key: OPENROUTER_API_KEY
        sync: false
      # NOTE: MODEL env var intentionally omitted — server.js picks a live
      # default (google/gemma-4-26b-a4b-it:free) with automatic fallback cascade.
      # Override only if you need to pin a specific model.

autoDeploy: true
