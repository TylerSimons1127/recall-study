services:
  - type: web
    name: recall-api
    runtime: node
    plan: free
    rootDir: server
    buildCommand: npm install
    startCommand: node index.js
    healthCheckPath: /health
    envVars:
      - key: OPENROUTER_API_KEY
        sync: false
      - key: MODEL
        value: meta-llama/llama-3.2-3b-instruct:free
