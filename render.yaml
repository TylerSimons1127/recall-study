services:
  - type: web
    name: recall-api
    runtime: node
    plan: free
    rootDir: server
    buildCommand: npm install
    startCommand: node index.js
    healthCheckPath: /health
    envVars:
      - key: OPENROUTER_API_KEY
        sync: false
      # Primary live model — if OpenRouter rotates this slug, the server's
      # fallback cascade in index.js tries the next one automatically.
      - key: MODEL
        value: google/gemma-3-1b-it:free

# autoDeploy: true
